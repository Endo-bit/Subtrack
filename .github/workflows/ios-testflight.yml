name: iOS TestFlight release

# Manual trigger only — this uploads a real build to App Store Connect / TestFlight,
# so it should never fire automatically on a push.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'eas.json build profile to use'
        required: false
        default: 'production'

jobs:
  build-and-submit:
    # React Native 0.81 / this Expo SDK's Podfile requires Xcode >= 16.1. macos-14's
    # default Xcode (15.4) is too old and fails at `pod install`; macos-15 defaults to
    # a current Xcode that satisfies this.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `/Applications/Xcode.app` on the runner is a "stable default" symlink that can lag
      # behind Apple's rolling minimum-SDK requirement for App Store Connect submissions
      # (confirmed: it built fine but Apple rejected the submission for an outdated SDK).
      # This picks whichever Xcode is actually the newest installed on the runner image.
      - name: Select latest available Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print selected Xcode version
        run: xcodebuild -version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli

      # Runs the full EAS build (prebuild + Xcode archive/export) on this GitHub-hosted
      # runner instead of Expo's cloud queue, so it does NOT consume EAS's monthly cloud
      # build-minute quota. It still uses the iOS distribution certificate / provisioning
      # profile already stored on the EAS project from the 1.0.0 release, so this must be
      # run non-interactively — it will fail if those credentials aren't already saved
      # server-side (see workflow README note).
      - name: Build iOS locally via EAS
        run: eas build --platform ios --profile "${{ inputs.profile }}" --local --non-interactive --output ./build.ipa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Baked into the JS bundle at build time (see utils/purchases.ts, utils/analytics.ts).
          # Without these the app still builds, but the Pro paywall and analytics silently no-op.
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}

      # Uploads the .ipa produced above to App Store Connect / TestFlight using the
      # App Store Connect API key already linked to this EAS project.
      # --no-wait: the upload is the part CI is responsible for. Waiting for Apple to finish
      # processing afterwards is what blew the 90-minute job timeout on the 1.0.2 run — the
      # upload had already succeeded, and Apple finished processing 12 minutes after GitHub
      # killed the job, so the "cancelled" run had in fact delivered the build.
      - name: Submit to TestFlight
        run: eas submit --platform ios --path ./build.ipa --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
